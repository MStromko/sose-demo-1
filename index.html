<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Todo List</h1>

    <form id="todo-form" class="input-row">
      <input id="todo-input" type="text" placeholder="Zadaj novú úlohu" required>
      <button type="submit">Pridať</button>
    </form>

    <input id="search-input" class="search-input" type="text" placeholder="Vyhľadaj úlohu">

    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
